<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDGs性別平權-情境題 - 劉芳君</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      background: #eef2f7;
      overflow: hidden;
      user-select: none;
    }

    /* 頂部控制列 */
    header {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      z-index: 10;
      pointer-events: none;
    }
    .header-title {
      font-size: 24px;
      font-weight: bold;
      color: #2b6cb0;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      backdrop-filter: blur(5px);
    }
    .status-bar {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .info-box {
      font-size: 17px;
      font-weight: bold;
      color: #2c5282;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .sound-btn {
      cursor: pointer;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .sound-btn:hover { transform: scale(1.1); }

    #amusement-park {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #93c5fd 0%, #e0f2fe 45%, #4ade80 100%);
    }

    /* 摩天輪 */
    .ferris-wheel {
      position: absolute;
      top: 12%; left: 8%;
      width: 160px; height: 160px;
      border: 6px dashed #ec4899;
      border-radius: 50%;
      animation: spin 18s linear infinite;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 七彩動態花朵 */
    .flower {
      position: absolute;
      width: 70px; height: 70px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: float 3s ease-in-out infinite;
    }
    .flower:hover {
      transform: scale(1.35) rotate(15deg);
      filter: drop-shadow(0 0 20px #fff);
    }
    .flower.visited {
      opacity: 0.4;
      filter: grayscale(0.8);
      cursor: default;
      animation: none;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .flower-petals {
      position: absolute;
      width: 100%; height: 100%;
      background: #f43f5e;
      border-radius: 50%;
      box-shadow: 0 0 0 12px #fb923c, 0 0 0 24px #facc15;
    }
    .flower-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px;
      background: #fff;
      border-radius: 50%;
      z-index: 2;
    }

    /* 🐢 彩蛋小海龜 */
    .turtle-easter-egg {
      position: absolute;
      bottom: 12%;
      left: 50%;
      font-size: 40px;
      cursor: pointer;
      animation: turtleWalk 12s linear infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
      transition: transform 0.2s;
    }
    .turtle-easter-egg:hover {
      transform: scale(1.3) rotate(10deg);
    }
    @keyframes turtleWalk {
      0% { left: 10%; transform: scaleX(1); }
      50% { left: 85%; transform: scaleX(1); }
      51% { transform: scaleX(-1); }
      100% { left: 10%; transform: scaleX(-1); }
    }

    /* 彈窗 UI */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #fff;
      width: 92%; max-width: 720px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .cards-pool {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 20px 0;
      min-height: 90px;
    }
    .drag-card {
      background: #e0f2fe;
      border: 2px dashed #0284c7;
      color: #0369a1;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 15px;
      cursor: grab;
      width: 48%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    .drag-card:hover { transform: translateY(-3px); }
    .drag-card:active { cursor: grabbing; transform: scale(0.96); }

    .drop-zones {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .drop-zone {
      flex: 1;
      min-height: 160px;
      border: 3px dashed #cbd5e1;
      border-radius: 18px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .zone-equal { background: #f0fdf4; border-color: #22c55e; }
    .zone-unequal { background: #fef2f2; border-color: #ef4444; }

    .action-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
    }
    .btn-submit { background: #3b82f6; }
    .btn-retry { background: #f59e0b; }
    .btn-cert { background: #10b981; }
    .action-btn:hover { transform: scale(1.08); }

    /* 浮動字體與彩花粒子 */
    .float-text {
      position: absolute;
      font-size: 26px;
      font-weight: bold;
      color: #10b981;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 120;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
    }
    .particle {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFall 1.2s ease-out forwards;
    }
    @keyframes particleFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">SDGs性別平權-情境題 (進階版)</div>
    <div class="status-bar">
      <button class="sound-btn" onclick="toggleSound()" id="sound-toggle">🔊</button>
      <div class="info-box">⏱ 時間：<span id="timer" style="color:#e53e3e;">60</span>s</div>
      <div class="info-box">答對：<span id="score" style="color:#2b6cb0;">0</span> / 8</div>
    </div>
  </header>

  <div id="amusement-park">
    <div class="ferris-wheel"></div>
    <!-- 🐢 彩蛋小海龜 -->
    <div class="turtle-easter-egg" onclick="triggerTurtleEgg()" title="點擊解救小海龜觸發彩蛋！">🐢</div>
  </div>

  <!-- 拖拽分類 Modal -->
  <div id="drag-modal" class="modal">
    <div class="modal-content">
      <h3 style="color: #1e293b; font-size: 22px;">請將下列情境拖拽至正確區塊中</h3>
      <div id="cards-container" class="cards-pool"></div>
      <div class="drop-zones">
        <div class="drop-zone zone-equal" ondragover="allowDrop(event)" ondrop="drop(event, 'equal')">
          <h4 style="color: #15803d; font-size: 18px;">性別平等 ✅</h4>
        </div>
        <div class="drop-zone zone-unequal" ondragover="allowDrop(event)" ondrop="drop(event, 'unequal')">
          <h4 style="color: #b91c1c; font-size: 18px;">性別不平等 / 偏見 ❌</h4>
        </div>
      </div>
      <button id="submit-group-btn" class="action-btn btn-submit" onclick="submitGroup()" style="display:none;">確認送出</button>
    </div>
  </div>

  <!-- 彩蛋問答 Modal -->
  <div id="egg-modal" class="modal">
    <div class="modal-content">
      <h3 style="color: #d97706; font-size: 24px; margin-bottom: 15px;">🐢 SDGs 生態危機彩蛋題！</h3>
      <p style="font-size: 18px; color: #334155; margin-bottom: 20px;">
        海龜被海洋垃圾困住了！回答問題幫助海龜，可獲得額外 <b>+15 秒</b> 倒數獎勵！<br><br>
        <b>問題：推動 SDGs 5 性別平權，也能促進整體永續社會與經濟進步發展，對嗎？</b>
      </p>
      <button class="action-btn btn-cert" onclick="answerEgg(true)">完全正確！✅</button>
      <button class="action-btn btn-retry" onclick="answerEgg(false)">不對 ❌</button>
    </div>
  </div>

  <!-- 結算結果 Modal -->
  <div id="result-modal" class="modal">
    <div class="modal-content">
      <h2 id="result-badge" style="font-size: 34px; margin-bottom: 12px;">結算中...</h2>
      <p id="result-msg" style="font-size: 18px; color: #475569; margin-bottom: 20px;"></p>
      <div id="result-action"></div>
    </div>
  </div>

  <script>
    // 原生 Web Audio API 音效產生器
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇';
    }

    const topicGroups = [
      { id: 0, cards: [{ id: "c1", text: "家事與照顧家人應由全家依能力分擔", type: "equal" }, { id: "c2", text: "女生數理能力較差，選文組比較適合", type: "unequal" }] },
      { id: 1, cards: [{ id: "c3", text: "不論男女，任何人表達脆弱都是正常的", type: "equal" }, { id: "c4", text: "男性不適合擔任幼兒園老師或照顧嬰兒", type: "unequal" }] },
      { id: 2, cards: [{ id: "c5", text: "公司升遷與薪資應依工作能力而非性別決定", type: "equal" }, { id: "c6", text: "男生的玩具只能選汽車，女生只能選娃娃", type: "unequal" }] },
      { id: 3, cards: [{ id: "c7", text: "爸爸媽媽均享有相同的育嬰假申請權益", type: "equal" }, { id: "c8", text: "女性婚後應該辭職專心在家相夫教子", type: "unequal" }] }
    ];

    let currentGroupIdx = -1;
    let correctCount = 0;
    let completedGroups = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let comboCount = 0;
    let eggUsed = false;
    const currentAssignments = {};

    const park = document.getElementById('amusement-park');
    const scoreElem = document.getElementById('score');
    const timerElem = document.getElementById('timer');

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        timerElem.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          showFinalEvaluation(true);
        }
      }, 1000);
    }

    function initFlowers() {
      topicGroups.forEach((group, idx) => {
        const flower = document.createElement('div');
        flower.className = 'flower';
        flower.id = `flower-${idx}`;
        const randomTop = Math.floor(Math.random() * 25) + 55;
        const randomLeft = Math.floor(Math.random() * 70) + 12;
        flower.style.top = randomTop + '%';
        flower.style.left = randomLeft + '%';
        flower.innerHTML = `<div class="flower-petals"></div><div class="flower-center"></div>`;
        flower.onclick = () => openGroupModal(idx);
        park.appendChild(flower);
      });
      startTimer();
    }

    function openGroupModal(idx) {
      playBeep(523, 'sine', 0.1);
      const flowerElem = document.getElementById(`flower-${idx}`);
      if (flowerElem.classList.contains('visited') || timeLeft <= 0) return;

      currentGroupIdx = idx;
      const groupData = topicGroups[idx];
      const pool = document.getElementById('cards-container');
      pool.innerHTML = '';

      document.querySelectorAll('.drop-zone').forEach(zone => {
        const h4 = zone.querySelector('h4');
        zone.innerHTML = '';
        zone.appendChild(h4);
      });

      groupData.cards.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.className = 'drag-card';
        cardElem.id = card.id;
        cardElem.innerText = card.text;
        cardElem.draggable = true;
        cardElem.ondragstart = (e) => e.dataTransfer.setData('text/plain', card.id);
        pool.appendChild(cardElem);
      });

      document.getElementById('submit-group-btn').style.display = 'none';
      document.getElementById('drag-modal').style.display = 'flex';
    }

    function allowDrop(e) { e.preventDefault(); }

    function drop(e, zoneType) {
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain');
      const cardElem = document.getElementById(cardId);
      let targetZone = e.target;
      if (!targetZone.classList.contains('drop-zone')) targetZone = targetZone.closest('.drop-zone');

      if (targetZone && cardElem) {
        targetZone.appendChild(cardElem);
        currentAssignments[cardId] = zoneType;
        playBeep(659, 'triangle', 0.12);
        spawnParticles(e.clientX, e.clientY);

        if (Object.keys(currentAssignments).length >= 2) {
          document.getElementById('submit-group-btn').style.display = 'inline-block';
        }
      }
    }

    function triggerTurtleEgg() {
      if (eggUsed) return;
      playBeep(880, 'sine', 0.2);
      document.getElementById('egg-modal').style.display = 'flex';
    }

    function answerEgg(isCorrect) {
      document.getElementById('egg-modal').style.display = 'none';
      eggUsed = true;
      if (isCorrect) {
        timeLeft += 15;
        timerElem.innerText = timeLeft;
        playBeep(1046, 'sine', 0.3);
        showFloatText("⏱ 時間 +15 秒！", window.innerWidth/2, window.innerHeight/2);
      }
    }

    function showFloatText(text, x, y) {
      const ft = document.createElement('div');
      ft.className = 'float-text';
      ft.innerText = text;
      ft.style.left = x + 'px';
      ft.style.top = y + 'px';
      document.body.appendChild(ft);
      setTimeout(() => ft.remove(), 1200);
    }

    function spawnParticles(x, y) {
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = ['#f43f5e', '#fb923c', '#3b82f6', '#22c55e'][Math.floor(Math.random()*4)];
        p.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
        p.style.setProperty('--dy', (Math.random() * 140 - 70) + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1200);
      }
    }

    function submitGroup() {
      document.getElementById('drag-modal').style.display = 'none';
      const groupData = topicGroups[currentGroupIdx];
      let groupCorrect = true;

      groupData.cards.forEach(card => {
        if (currentAssignments[card.id] === card.type) {
          correctCount++;
        } else {
          groupCorrect = false;
        }
      });

      if (groupCorrect) {
        comboCount++;
        playBeep(784, 'sine', 0.25);
        if (comboCount >= 2) {
          showFloatText(`🔥 Combo x${comboCount}!`, window.innerWidth/2 - 50, 100);
        }
      } else {
        comboCount = 0;
        playBeep(220, 'sawtooth', 0.2);
      }

      scoreElem.innerText = correctCount;
      document.getElementById(`flower-${currentGroupIdx}`).classList.add('visited');
      completedGroups++;
      for (let key in currentAssignments) delete currentAssignments[key];

      if (completedGroups === 4) {
        clearInterval(timerInterval);
        setTimeout(() => showFinalEvaluation(false), 500);
      }
    }

    function showFinalEvaluation(isTimeOut) {
      document.getElementById('drag-modal').style.display = 'none';
      const modal = document.getElementById('result-modal');
      const badge = document.getElementById('result-badge');
      const msg = document.getElementById('result-msg');
      const actionArea = document.getElementById('result-action');

      modal.style.display = 'flex';

      if (isTimeOut) {
        badge.innerText = "時間到！⏰";
        msg.innerText = `時間已結束！您答對了 ${correctCount} / 8 題，再試一次挑戰更快的速度吧！`;
        actionArea.innerHTML = `<button class="action-btn btn-retry" onclick="location.reload()">再次挑戰</button>`;
      } else if (correctCount <= 5) {
        badge.innerText = "等級：再加油 💡";
        msg.innerText = `您答對了 ${correctCount} / 8 題。別灰心，多加練習就能突破難關！`;
        actionArea.innerHTML = `<button class="action-btn btn-retry" onclick="location.reload()">再次挑戰</button>`;
      } else if (correctCount <= 7) {
        badge.innerText = "等級：進步中 👍";
        msg.innerText = `您答對了 ${correctCount} / 8 題，表現相當優異！就差最後一步拿到滿分了！`;
        actionArea.innerHTML = `<button class="action-btn btn-retry" onclick="location.reload()">再次挑戰</button>`;
      } else {
        badge.innerText = "等級：平權達人 🏆";
        msg.innerText = `完美通關！您全數答對 8 題！成功榮獲「SDGs 性別平權小達人」稱號！`;
        actionArea.innerHTML = `<a href="certificate.html" class="action-btn btn-cert">下載學習證書</a>`;
      }
    }

    window.onload = initFlowers;
  </script>
</body>
</html>
