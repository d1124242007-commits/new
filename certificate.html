<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDGs性別平權小達人證書 - 劉芳君</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", serif, sans-serif;
    }
    body {
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 頂部控制與輸入區 */
    .control-panel {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .control-panel label {
      font-size: 16px;
      font-weight: bold;
      color: #334155;
    }
    .control-panel input {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .control-panel input:focus {
      border-color: #3b82f6;
    }
    .btn-print {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #10b981;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-print:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* 證書主體卡片 */
    .certificate-container {
      width: 800px;
      height: 560px;
      background: #ffffff;
      border: 12px solid #d97706;
      outline: 4px solid #fef3c7;
      border-radius: 12px;
      padding: 40px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      background-image: radial-gradient(#fffbeb 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* 證書角花邊框 */
    .corner-decor {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 4px solid #b45309;
    }
    .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    /* 證書文字樣式 */
    .cert-title {
      font-size: 36px;
      font-weight: bold;
      color: #92400e;
      letter-spacing: 4px;
      margin-top: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .cert-badge {
      font-size: 24px;
      font-weight: bold;
      color: #047857;
      background: #d1fae5;
      padding: 6px 20px;
      border-radius: 20px;
      display: inline-block;
      margin: 10px 0;
    }
    .cert-name {
      font-size: 32px;
      font-weight: bold;
      color: #1e293b;
      border-bottom: 3px solid #94a3b8;
      padding: 0 30px 5px 30px;
      min-width: 200px;
      display: inline-block;
    }
    .cert-body {
      font-size: 18px;
      color: #475569;
      line-height: 1.8;
      max-width: 650px;
    }
    .cert-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px;
    }
    .cert-date {
      font-size: 14px;
      color: #64748b;
    }
    .cert-seal {
      width: 80px;
      height: 80px;
      background: #dc2626;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(220, 38, 38, 0.4);
      transform: rotate(-10deg);
    }

    /* 列印專屬 CSS 模式 */
    @media print {
      body {
        background: #ffffff;
        padding: 0;
        justify-content: center;
      }
      .control-panel {
        display: none !important; /* 列印時隱藏控制區 */
      }
      .certificate-container {
        box-shadow: none;
        border-color: #d97706;
      }
    }
  </style>
</head>
<body>

  <!-- 控制面板（輸入姓名與列印按鈕） -->
  <div class="control-panel">
    <label for="userName">請輸入您的姓名：</label>
    <input type="text" id="userName" placeholder="例如：劉芳君" oninput="updateName()">
    <button class="btn-print" onclick="printCertificate()">下載 / 列印證書</button>
  </div>

  <!-- 證書區域 -->
  <div class="certificate-container" id="certificate">
    <!-- 四角飾條 -->
    <div class="corner-decor top-left"></div>
    <div class="corner-decor top-right"></div>
    <div class="corner-decor bottom-left"></div>
    <div class="corner-decor bottom-right"></div>

    <div class="cert-title">榮譽學習證書</div>
    <div class="cert-badge">SDGs 性別平權小達人</div>

    <div class="cert-body">
      茲證明 <span class="cert-name" id="displayName">劉芳君</span> 學員<br>
      參加「SDGs 性別平權」地圖關卡與情境挑戰，全數答對並展現出卓越的性別平等觀念與實踐素養，特頒此證，以茲鼓勵。
    </div>

    <div class="cert-footer">
      <div class="cert-date">頒發日期：<span id="currentDate">2026 年 11 月 02 日</span></div>
      <div class="cert-seal">SDGs<br>認證章</div>
    </div>
  </div>

  <script>
    // 即時更新證書上的姓名
    function updateName() {
      const inputVal = document.getElementById('userName').value.trim();
      const nameDisplay = document.getElementById('displayName');
      nameDisplay.innerText = inputVal !== "" ? inputVal : "劉芳君";
    }

    // 自動填入今日日期
    function initDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      document.getElementById('currentDate').innerText = `${year} 年 ${month} 月 ${day} 日`;
    }

    // 觸發列印功能
    function printCertificate() {
      window.print();
    }

    // 頁面載入初始化
    window.onload = initDate;
  </script>
</body>
</html>
